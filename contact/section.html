<section id="contacto" class="contact-section" aria-labelledby="contact-title">
  <div class="contact-layout">
    <div><p class="contact-label">Contacto</p><h2 id="contact-title">Cuéntanos qué tarea te gustaría dejar de hacer manualmente.</h2><p id="contact-info">Cuéntanos qué ocurre hoy y qué resultado buscas. Te responderemos por correo para comentar el proceso y los siguientes pasos. Evita incluir datos confidenciales.</p><a href="mailto:sysvark@outlook.com">sysvark@outlook.com</a></div>
    <noscript><p>El envío desde el formulario requiere JavaScript. Puedes enviar tu consulta a la dirección de correo indicada.</p></noscript>
    <form id="proposal" action="https://formsubmit.co/ajax/sysvark@outlook.com" aria-describedby="contact-info" method="post">
      <input type="hidden" name="_subject" value="Nueva consulta desde la web de SYSVARK"><fieldset disabled><legend>Solicitud de propuesta</legend>
        <div class="contact-fields">
          <label>Nombre<input name="nombre" autocomplete="name" required maxlength="100"></label>
          <label>Empresa<input name="empresa" autocomplete="organization" required maxlength="160"></label>
          <label>Correo profesional<input name="email" type="email" autocomplete="email" required maxlength="254"></label>
          <label>Teléfono (opcional)<input name="telefono" type="tel" autocomplete="tel" maxlength="35"></label>
        </div>
        <label>Proceso que quieres automatizar<textarea name="proceso" required minlength="10" maxlength="3000" rows="3"></textarea></label>
        <label hidden>Deja vacío este campo<input name="_honey" tabindex="-1" autocomplete="off"></label>
        <label class="consent"><input name="privacidad" type="checkbox" required value="aceptada">He leído y acepto la <a href="./privacidad.html">política de privacidad</a>.</label>
        <button type="submit">Enviar consulta</button>
      </fieldset>
      <p role="status" aria-atomic="true" id="send-status"></p>
    </form>
  </div>
</section>
